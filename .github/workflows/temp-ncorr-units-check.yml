name: temporary-ncorr-units-check

on:
  push:
    branches:
      - fix/ncorr-displacement-units-v7

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m py_compile main.py src/core/*.py src/gui/*.py tests/*.py
