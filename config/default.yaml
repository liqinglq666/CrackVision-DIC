experiment:
  # Raw image scale: converts Ncorr displacement values from px to mm.
  mm_per_pixel: 0.045

  # DIC subset-center spacing in raw image pixels.
  # Length/search radii on the DIC grid use mm_per_pixel * dic_subset_spacing_px.
  dic_subset_spacing_px: 1.0

  # Fallback DIC time step when the .mat file does not contain a real timestamp.
  # This directly affects MTS synchronization, so verify it for every experiment.
  sampling_interval_s: 5.0

  cross_section_area_mm2: 100.0
  gauge_length_mm: 80.0

  virtual_extensometer:
    left_fraction: 0.10
    right_fraction: 0.90
    band_width_points: 3
    gauge_length_mm:

sync:
  min_overlap_fraction: 0.60
  max_missing_fraction: 0.05
  override_dic_strain_with_mts: false

  # Optional trigger-delay correction. Positive values shift that timeline forward.
  dic_time_offset_s: 0.0
  mts_time_offset_s: 0.0

quality:
  enabled: true
  # Supported values: finite_only, higher_is_better, lower_is_better.
  metric_mode: finite_only
  threshold:
  min_valid_fraction: 0.20

physics:
  strain_threshold_k: 1.5
  min_cracking_strain: 1.5e-4
  max_cracking_strain_threshold: 0.03
  morphology_closing_radius_points: 0
  min_crack_area_points: 10
  min_crack_length_mm: 0.2

  # Strongly recommended for angled cracks. If false, COD falls back to u-only projection.
  require_v_map_for_cod: true

  cod_sampling:
    delta_points: 3
    max_search_points: 15
    delta_mm:
    max_search_mm:

  cod_min_mm: 0.002
  cod_min_mean_mm: 0.002
  cod_max_mm: 5.0

  # Keeps DIC virtual extensometer strain monotonic during single-axis tensile loading.
  # Disable for unloading/cyclic tests.
  enforce_monotonic_strain: true

validation:
  annotation_path:

export:
  target_strains: [0.2, 2.0, 4.0, 6.0]
