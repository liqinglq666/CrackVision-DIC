experiment:
  # Fallback only for original Ncorr MAT files that lack pixtounits.
  mm_per_pixel: 0.045

  # Fallback only when original MAT lacks Ncorr spacing metadata.
  dic_step_px: 3.0

  # Native Ncorr spacing is a skipped-pixel count: centre step = spacing + 1.
  ncorr_spacing_is_gap_count: true

  # Fallback for old MAT files without timestamps. Your current acquisition is 5 s/image.
  sampling_interval_s: 5.0

physics:
  # Ncorr reference-formatted Exy is a tensor Green-Lagrange shear component.
  shear_component_is_engineering: false

  detection:
    threshold_k: 2.0
    min_tensile_strain: 0.0002
    max_threshold: 0.05

    # ECC/SHCC fine cracks: permissive candidate morphology; COD filters later.
    min_crack_area_points: 4
    closing_radius_points: 0
    min_crack_length_mm: 0.15
    normal_radius_points: 4

  cod:
    # Sample both crack faces over a physical distance window and extrapolate to the crack plane.
    near_mm: 0.15
    far_mm: 0.75
    samples_per_side: 7
    min_valid_per_side: 3
    sample_stride_points: 1
    min_samples_per_crack: 3

    min_width_mm: 0.001
    max_width_mm: 2.0

    robust_sigma: 3.5
    min_fit_r2: -1.0
